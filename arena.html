<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUARTER · Play together</title><link rel="stylesheet" href="assets/play.css"></head>
<body><main><header><a href="index.html">← Library</a><h1 id="title">Play together</h1><select id="game" aria-label="Game"><option value="pong">Pong</option><option value="ttt">Tic-Tac-Toe</option><option value="connect4">Connect Four</option></select></header>
<div class="panel"><div class="controls"><button id="local">Same device</button><button id="create">Create invite</button><button id="join">Join a friend</button><button id="restart">Restart</button></div><p id="status" class="status" role="status"></p>
<div id="connection" hidden><p>Open this game on both devices on the same Wi-Fi. Player 1 sends an invite; player 2 pastes it and sends a reply; player 1 pastes the reply. No account or game server required. Guest networks may block the direct connection.</p><label for="outgoing">Your invite / reply — send this privately to the other player</label><textarea id="outgoing" readonly rows="3" spellcheck="false" placeholder="Your connection code appears here"></textarea><button id="copy">Copy code</button><label for="incoming">Other player’s invite / reply</label><textarea id="incoming" rows="3" spellcheck="false" placeholder="Paste their entire QUARTER1 code here"></textarea><button id="apply">Connect</button></div></div>
<p id="score"></p><div id="play"></div><div class="touch" id="touch" hidden><button data-direction="-1">▲ Up</button><button data-direction="1">▼ Down</button></div><p id="help" class="status"></p></main>
<script src="assets/arena-engine.js"></script><script src="assets/arena.js"></script></body></html>
